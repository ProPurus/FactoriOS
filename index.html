<!DOCTYPE html>
<html>
  <head>
    <script type="module" src="script.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css"/>
  </head>
  <body style="font-family: Georgia, 'Times New Roman', Arial; background-image: url(Factorio\ background.jpg); background-size: cover; height: 100vh;">
    <div id="topbar" style="z-index: 6; display: flex; justify-content: space-between; color: orange; background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(5px); padding-left: 15px; padding-right: 15px; margin-bottom: 25px; border-radius: 15px;">
      <p>FactoriOS</p>
      <p id="introopen" style="cursor: pointer;">Open intro screen</p>
      <script>
        function updateTime(){
          var currentTime = new Date().toLocaleString();
          var timeText = document.querySelector("#clock");
          timeText.innerHTML = currentTime;
        }
        setInterval(updateTime, 1000);
      </script>
      <p id="clock">Current Time</p>
    </div>
    <div id="appbar" style="display: flex;">
      <div id="notesicon" style="text-align: center; width: fit-content; color: orange; margin-left: 10px; margin-right: 10px;">
        <img src="Blueprint Book.png" style="width: 100px; border-radius: 10px; margin-top: 0px;"/>
        <p style="margin-top: 0px; background-color: #3c3b3c; border-radius: 15px; margin-left: 20px; margin-right: 20px;">Notes</p>
      </div>
      <div id="terminalicon" style="text-align: center; width: fit-content; color: orange; margin-left: 10px; margin-right: 10px;">
        <img src="Blueprint Book.png" style="width: 100px; border-radius: 10px; margin-top: 0px;"/>
        <p style="margin-top: 0px; background-color: #3c3b3c; border-radius: 15px; margin-left: 20px; margin-right: 20px;">terminal</p>
      </div>
    </div>
    <div class="window" id="intro" style="z-index: 5; width: 617px; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #3c3b3c; background-color: orange; border-color: #3c3b3c;">
        <div class="windowheader" id="introheader" style="width: 617px;">
          <p style="text-align: center; margin: 5px;">Handle</p>
          <div class="closebutton" id="introclose">
            <p style="margin: 5px;">Close</p>
          </div>
        </div>
        <h1 style="margin-bottom: 5px; padding-bottom: 2px;">Welcome, fellow Factorio-enjoyer!</h1>
        <h2 style="margin-top: 5px;">This <dfn>Factorio-themed</dfn> OS aims to feel like Factorio, so it's designed around <dfn>efficiency</dfn> ;)</h2>
        <img style="border-radius: 15px; object-fit: cover;" src="Factorio Titelscreen.jpg"/>
    </div>
    <div class="window" id="notes" style="z-index: 1; display: flex; width: 800px; top: 50%; left: 50%; transform: translate(-50%, -50%);">
      <div class="windowheader" id="notesheader">
        <p style="text-align: center; margin: 5px;">Notes</p>
        <div class="closebutton" id="notesclose">
          <p style="margin: 5px;">Close</p>
        </div>
      </div>
      <p>super cool notes app</p>
    </div>
    <div class="window" id="terminal" style="z-index: 1; display: flex; width: 800px; top: 50%; left: 50%; transform: translate(-50%, -50%);">
      <div class="windowheader" id="terminalheader">
        <p style="text-align: center; margin: 5px;">Terminal</p>
        <div class="closebutton" id="terminalclose">
          <p style="margin: 5px;">Close</p>
        </div>
      </div>
      <p>test Terminal</p>
    </div>
    <script src="script.js"></script>
  </body>
</html>
